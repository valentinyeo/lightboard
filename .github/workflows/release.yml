name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        shell: pwsh
        run: |
          if ($env:TAG -cnotmatch '\Av[0-9]+\.[0-9]+\.[0-9]+\z') {
            throw 'Tag must match vX.Y.Z.'
          }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Run unit tests
        run: zig build test
      - name: Build Windows x86_64 release
        run: zig build -Doptimize=ReleaseSmall -Dtarget=x86_64-windows
      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $hash = (Get-FileHash zig-out/bin/lightboard.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  lightboard.exe" | Set-Content zig-out/bin/SHA256SUMS.txt -Encoding ascii
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$env:TAG" --json tagName
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:TAG" --verify-tag --title "$env:TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          gh release upload "$env:TAG" zig-out/bin/lightboard.exe zig-out/bin/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
